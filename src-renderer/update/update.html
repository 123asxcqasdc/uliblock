<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
        color: #1c2420;
        background-color: #f6faf6;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .header {
        background: linear-gradient(135deg, #22a630 0%, #177421 100%);
        color: #ffffff;
        padding: 18px 22px;
      }
      .header h1 {
        margin: 0 0 4px;
        font-size: 20px;
        font-weight: 800;
      }
      .header p {
        margin: 0;
        font-size: 13.5px;
        opacity: 0.94;
      }

      .content {
        padding: 16px 22px 18px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
      }

      .version-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #ffffff;
        border: 1px solid #cce7cf;
        border-radius: 10px;
        padding: 9px 13px;
        font-size: 13.5px;
      }
      .version-badge {
        background: #e9f8eb;
        color: #177421;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 6px;
      }
      .version-badge.new {
        background: #22a630;
        color: #ffffff;
      }

      .notes-box {
        flex: 1;
        min-height: 100px;
        background: #ffffff;
        border: 1px solid #d4e8d6;
        border-radius: 10px;
        padding: 12px 14px;
        overflow-y: auto;
        font-size: 13.5px;
        line-height: 1.5;
        white-space: pre-wrap;
        color: #29382d;
      }

      .progress-wrap {
        display: none;
        flex-direction: column;
        gap: 6px;
        background: #ffffff;
        border: 1px solid #cce7cf;
        border-radius: 10px;
        padding: 11px 14px;
      }
      .progress-wrap.visible {
        display: flex;
      }
      .progress-status {
        font-size: 13px;
        font-weight: 600;
        color: #1c2420;
      }
      .progress-bar-track {
        width: 100%;
        height: 10px;
        background: #e4efe5;
        border-radius: 999px;
        overflow: hidden;
      }
      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background: #22a630;
        transition: width 0.15s ease;
      }

      .error-box {
        display: none;
        background: #fff1f1;
        border: 1px solid #f0b4b4;
        color: #8c1d1d;
        border-radius: 9px;
        padding: 10px 12px;
        font-size: 13px;
      }
      .error-box.visible {
        display: block;
      }

      .footer-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }

      .skip-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: #4f5f56;
        cursor: pointer;
        user-select: none;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      button {
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        padding: 9px 16px;
        border-radius: 8px;
        border: 1px solid #c9d9cb;
        background: #ffffff;
        color: #1c2420;
      }
      button:hover:not(:disabled) {
        background: #eef6ef;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .btn-primary {
        background: #22a630;
        border-color: #177421;
        color: #ffffff;
      }
      .btn-primary:hover:not(:disabled) {
        background: #1b8c27;
      }

      .release-link {
        font-size: 12.5px;
        color: #177421;
        text-decoration: underline;
        cursor: pointer;
        background: none;
        border: 0;
        padding: 0;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1 id="title">Доступно обновление UliBlock</h1>
      <p id="subtitle">Редактор закроется и автоматически запустит установщик новой версии.</p>
    </div>

    <div class="content">
      <div class="version-pill">
        <span>Текущая:</span>
        <span class="version-badge" id="cur-ver"></span>
        <span>→</span>
        <span>Новая:</span>
        <span class="version-badge new" id="new-ver"></span>
        <button type="button" class="release-link" id="open-release" style="margin-left: auto;">GitHub Releases</button>
      </div>

      <div class="notes-box" id="notes"></div>

      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-status" id="progress-status">Подготовка загрузки...</div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
      </div>

      <div class="error-box" id="error-box"></div>

      <div class="footer-row">
        <label class="skip-label">
          <input type="checkbox" id="skip-checkbox">
          <span>Пропустить эту версию</span>
        </label>

        <div class="actions">
          <button type="button" id="later-btn">Позже</button>
          <button type="button" class="btn-primary" id="update-btn">Обновить сейчас</button>
        </div>
      </div>
    </div>

    <script>
      const {appName} = UpdatePreload.getStrings();
      const info = UpdatePreload.getInfo();

      document.getElementById('title').textContent = `Доступно обновление ${appName}!`;
      document.getElementById('cur-ver').textContent = `v${info.currentVersion}`;
      document.getElementById('new-ver').textContent = info.tag || `v${info.latestVersion}`;

      const notesEl = document.getElementById('notes');
      if (info.releaseNotes && info.releaseNotes.trim()) {
        notesEl.textContent = info.releaseNotes.trim();
      } else {
        notesEl.textContent = `Вышла новая версия ${appName} ${info.tag || 'v' + info.latestVersion}.\n\nНажмите «Обновить сейчас», чтобы закрыть редактор и автоматически установить обновление (при установке в систему потребуется только ввод пароля администратора).`;
      }

      const updateBtn = document.getElementById('update-btn');
      const laterBtn = document.getElementById('later-btn');
      const skipCheckbox = document.getElementById('skip-checkbox');
      const progressWrap = document.getElementById('progress-wrap');
      const progressStatus = document.getElementById('progress-status');
      const progressFill = document.getElementById('progress-fill');
      const errorBox = document.getElementById('error-box');

      document.getElementById('open-release').addEventListener('click', () => {
        UpdatePreload.openReleasePage();
      });

      laterBtn.addEventListener('click', () => {
        UpdatePreload.ignore(skipCheckbox.checked);
      });

      const formatMB = (bytes) => `${(bytes / (1024 * 1024)).toFixed(1)} МБ`;

      UpdatePreload.onProgress((payload) => {
        if (payload.error) {
          errorBox.textContent = `Не удалось запустить автообновление: ${payload.error}`;
          errorBox.classList.add('visible');
          updateBtn.disabled = false;
          laterBtn.disabled = false;
          updateBtn.textContent = 'Повторить';
          return;
        }
        if (payload.status) {
          progressStatus.textContent = payload.status;
        }
        if (typeof payload.percent === 'number') {
          progressFill.style.width = `${payload.percent}%`;
          if (payload.total > 0) {
            progressStatus.textContent = `Загрузка установщика: ${payload.percent}% (${formatMB(payload.received)} / ${formatMB(payload.total)})`;
          }
        }
      });

      updateBtn.addEventListener('click', async () => {
        errorBox.classList.remove('visible');
        progressWrap.classList.add('visible');
        progressFill.style.width = '0%';
        progressStatus.textContent = 'Подготовка загрузки установщика...';
        updateBtn.disabled = true;
        laterBtn.disabled = true;
        skipCheckbox.disabled = true;

        const result = await UpdatePreload.startUpdate();
        if (result && !result.ok) {
          errorBox.textContent = `Не удалось запустить автообновление: ${result.error || 'неизвестная ошибка'}`;
          errorBox.classList.add('visible');
          updateBtn.disabled = false;
          laterBtn.disabled = false;
          skipCheckbox.disabled = false;
          updateBtn.textContent = 'Повторить';
        }
      });
    </script>
  </body>
</html>
