name: Release

on:
  push:
    tags:
    - 'v*'

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
    - name: Ensure GitHub Release exists for tag
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "UliBlock ${GITHUB_REF_NAME}" \
            --generate-notes
        fi

  release-linux:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install dependencies
      run: npm ci --loglevel=info
    - name: Fetch
      run: npm run fetch
    - name: Compile
      run: npm run webpack:prod
    - name: Package (AppImage + deb)
      run: |
        node release-automation/build.mjs --debian --appimage --x64 --arm64 --production
    - name: Print file tree
      run: node scripts/print-file-tree.mjs dist
    - name: Upload artifacts to GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: uliblock-linux
        path: |
          dist/*.deb
          dist/*.AppImage
    - name: Upload artifacts to GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${GITHUB_REF_NAME}" dist/*.deb dist/*.AppImage --repo "${GITHUB_REPOSITORY}" --clobber

  release-windows:
    needs: prepare-release
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false
        path: repo
    - name: "Move repository to D: drive"
      run: |
        Copy-Item -Path repo -Destination D:\repo -Recurse
        Remove-Item -Path repo -Recurse -Force
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: "Configure npm to use D: drive"
      run: |
        npm config set cache D:\npm-cache
        npm config set prefix D:\npm-prefix
    - name: Install dependencies
      working-directory: D:\repo
      run: npm ci --loglevel=info
    - name: Fetch
      working-directory: D:\repo
      run: npm run fetch
    - name: Compile
      working-directory: D:\repo
      run: npm run webpack:prod
    - name: Package (NSIS x64)
      working-directory: D:\repo
      run: |
        node release-automation/build.mjs --windows --x64 --production
    - name: Print file tree
      working-directory: D:\repo
      run: node scripts/print-file-tree.mjs dist
    - name: Upload artifacts to GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: uliblock-windows
        path: |
          D:\repo\dist\*.exe
    - name: Upload artifacts to GitHub Release
      working-directory: D:\repo
      env:
        GH_TOKEN: ${{ github.token }}
      shell: pwsh
      run: |
        $files = Get-ChildItem -Path dist -Filter *.exe | ForEach-Object { $_.FullName }
        gh release upload "$env:GITHUB_REF_NAME" @files --repo "$env:GITHUB_REPOSITORY" --clobber
