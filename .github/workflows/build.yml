name: Build (Manual)

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install dependencies
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      run: npm ci --loglevel=info
    - name: Fetch
      run: npm run fetch
    - name: Compile
      run: npm run webpack:prod
    - name: Package (Full AppImage + deb & Lightweight .deb Installer AppImage)
      run: |
        node release-automation/build.mjs --debian --appimage --x64 --arm64
        bash scripts/linux-deb-installer/build-deb-installer-appimage.sh x64
        bash scripts/linux-deb-installer/build-deb-installer-appimage.sh arm64
    - name: Print file tree
      run: node scripts/print-file-tree.mjs dist
    - name: Upload artifacts to GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: uliblock-linux
        path: |
          dist/*.deb
          dist/*.AppImage

  build-windows:
    # GitHub's Windows runners have much faster write performance on the D: drive.
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        persist-credentials: false
        path: repo
    - name: "Move repository to D: drive"
      run: |
        Copy-Item -Path repo -Destination D:\repo -Recurse
        Remove-Item -Path repo -Recurse -Force
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: "Configure npm to use D: drive"
      run: |
        npm config set cache D:\npm-cache
        npm config set prefix D:\npm-prefix
    - name: Install dependencies
      working-directory: D:\repo
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      run: npm ci --loglevel=info
    - name: Fetch
      working-directory: D:\repo
      run: npm run fetch
    - name: Compile
      working-directory: D:\repo
      run: npm run webpack:prod
    - name: Package (NSIS x64)
      working-directory: D:\repo
      run: |
        node release-automation/build.mjs --windows --x64
    - name: Print file tree
      working-directory: D:\repo
      run: node scripts/print-file-tree.mjs dist
    - name: Upload artifacts to GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: uliblock-windows
        path: |
          D:\repo\dist\*.exe
